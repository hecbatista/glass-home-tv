plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hecbatista.glasshome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.hecbatista.glasshome')
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '2.6'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(Test).configureEach {
    // SPOTIFY_LIVE=1 runs SpotifyLiveTest against the real Spotify: never "up to date" then (Gradle cannot see that
    // the account's playback changed), and the test's own lines are printed.
    if (System.getenv('SPOTIFY_LIVE') == '1' || System.getenv('LYRICS_LIVE') == '1') {
        outputs.upToDateWhen { false }
        testLogging { showStandardStreams = true }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub on the JVM; the Spotify parser's tests need the real thing.
    testImplementation 'org.json:json:20240303'
}
